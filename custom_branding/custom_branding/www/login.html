{% extends "templates/web.html" %}

{% block title %}{{ _("Login") }}{% endblock %}

{% block page_content %}
<div class="login-wrapper">
    <div class="login-card">
        <img src="/assets/custom_branding/images/logo.png" alt="Company Logo" class="login-logo">
        <h3 class="login-title">{{ _("Welcome Back") }}</h3>
        <form id="login-form" role="form">
            <div class="form-group">
                <label for="login_email">{{ _("Username") }}</label>
                <input type="text" id="login_email" name="usr" class="form-control" placeholder="{{ _('Enter your username') }}" required>
            </div>
            <div class="form-group">
                <label for="login_password">{{ _("Password") }}</label>
                <input type="password" id="login_password" name="pwd" class="form-control" placeholder="{{ _('Enter your password') }}" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">{{ _("Login") }}</button>
        </form>
    </div>
</div>
{% endblock %}
